name: Package and static checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff build PyYAML
      - run: ruff check talc_awr
      - run: python -m compileall -q talc_awr
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -c "import importlib.metadata; print(importlib.metadata.version('talc-awr'))"
