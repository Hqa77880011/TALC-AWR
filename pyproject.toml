[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "talc-awr"
version = "0.1.0"
description = "Task-Aware Lightweight Continual Learning for All-in-One Adverse Weather Image Restoration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "scipy>=1.13,<2",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
metrics = ["lpips==0.1.4"]
perception = ["transformers>=4.45,<5", "pycocotools>=2.0.8,<3"]
dev = ["ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
talc = "talc_awr.cli:main"

[tool.setuptools.packages.find]
include = ["talc_awr*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
